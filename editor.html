<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Editor - PDFNova</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E94350">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bundled local PDF.js -->
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
</head>
<body style="overflow:hidden;">

  <div class="editor-layout">
    <!-- Editor Header -->
    <header class="editor-navbar">
      <div style="display:flex;align-items:center;gap:16px;">
        <a href="index.html" class="nav-brand" style="font-size:1.15rem;">
          <div class="brand-icon" style="width:32px;height:32px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
          </div>
          <span>PDFNova</span>
        </a>
        <span style="color:var(--border-light);">|</span>
        <div class="editor-filename">
          <span id="editorDocTitle">Sample_Document.pdf</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:12px;">
        <button type="button" class="btn btn-secondary btn-sm" id="openFileBtn">Open File</button>
        <input type="file" id="editorFileInput" accept=".pdf,application/pdf" style="display:none">

        <button type="button" class="btn btn-primary btn-sm" id="downloadPdfBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Download</span>
        </button>

        <button type="button" class="theme-toggle" aria-label="Toggle Theme"></button>
      </div>
    </header>

    <!-- Editor Body -->
    <div class="editor-body">
      
      <!-- Left Thumbnails Sidebar -->
      <aside class="editor-thumbnails" id="thumbnailsContainer">
        <!-- Rendered by editor.js -->
      </aside>

      <!-- Center Canvas Viewport -->
      <main class="editor-viewport">
        <!-- Top Workspace Toolbar -->
        <div class="editor-toolbar">
          <!-- Zoom -->
          <button type="button" class="tool-btn" id="zoomOutBtn" title="Zoom Out">−</button>
          <span id="zoomLevelText" style="font-size:0.85rem;font-weight:600;min-width:44px;text-align:center;">125%</span>
          <button type="button" class="tool-btn" id="zoomInBtn" title="Zoom In">+</button>

          <div class="toolbar-separator"></div>

          <!-- Pagination -->
          <button type="button" class="tool-btn" id="prevPageBtn" title="Previous Page">‹</button>
          <span id="pageInfoText" style="font-size:0.85rem;font-weight:600;min-width:54px;text-align:center;">1 / 1</span>
          <button type="button" class="tool-btn" id="nextPageBtn" title="Next Page">›</button>

          <div class="toolbar-separator"></div>

          <!-- Active Tools -->
          <button type="button" class="tool-btn active" data-tool="select" title="Select / Navigate">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
          </button>
          <button type="button" class="tool-btn" data-tool="text" title="Add Text (T)">
            <span style="font-weight:700;font-size:1.1rem;">T</span>
          </button>
          <button type="button" class="tool-btn" data-tool="highlight" title="Highlight">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2.78 2.78 0 0 1-3.9 0L10.6 13.7a2.78 2.78 0 0 1 0-3.9L15.2 5.2a2.78 2.78 0 0 1 3.9 0l2.9 2.9a2.78 2.78 0 0 1 0 3.9Z"/></svg>
          </button>
          <button type="button" class="tool-btn" data-tool="rectangle" title="Rectangle Box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          </button>
          <button type="button" class="tool-btn" data-tool="signature" title="Stamp Signature">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
          </button>
        </div>

        <!-- Canvas Area -->
        <div class="editor-canvas-container" id="canvasContainer">
          <div class="page-wrapper" id="pageWrapper">
            <canvas id="pdfCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
          </div>
        </div>
      </main>

      <!-- Right Sidebar: Annotations & Page Actions -->
      <aside class="editor-sidebar">
        <div>
          <h4 class="panel-title">Annotations</h4>
          <div class="action-list">
            <button type="button" class="action-btn" onclick="document.querySelector('[data-tool=text]').click()">
              <span style="font-weight:700;">T</span>
              <span>Text</span>
            </button>
            <button type="button" class="action-btn" onclick="document.querySelector('[data-tool=highlight]').click()">
              <span>✎</span>
              <span>Highlight</span>
            </button>
            <button type="button" class="action-btn" onclick="document.querySelector('[data-tool=rectangle]').click()">
              <span>▢</span>
              <span>Rectangle</span>
            </button>
            <button type="button" class="action-btn" onclick="document.getElementById('sigModal').classList.add('open')">
              <span>✍</span>
              <span>Signature</span>
            </button>
          </div>
        </div>

        <div>
          <h4 class="panel-title">Page Actions</h4>
          <div class="action-list">
            <button type="button" class="action-btn" id="rotateLeftBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>Rotate Left</span>
            </button>
            <button type="button" class="action-btn" id="rotateRightBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
              <span>Rotate Right</span>
            </button>
            <button type="button" class="action-btn" id="deletePageBtn" style="color:#DC2626;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              <span>Delete Page</span>
            </button>
            <button type="button" class="action-btn" id="duplicatePageBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Duplicate Page</span>
            </button>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <!-- Draw Signature Modal -->
  <div class="modal-overlay" id="sigModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Draw Signature</h3>
        <button type="button" id="closeSigModalBtn" style="font-size:1.4rem;color:var(--text-muted);">✕</button>
      </div>
      <p style="font-size:0.88rem;color:var(--text-secondary);margin-bottom:14px;">
        Draw your signature inside the box using your mouse, trackpad, or finger.
      </p>
      <canvas id="sigPad" class="sig-pad-canvas"></canvas>
      <div style="display:flex;justify-content:space-between;margin-top:16px;">
        <button type="button" class="btn btn-secondary btn-sm" id="clearSigBtn">Clear Pad</button>
        <button type="button" class="btn btn-primary btn-sm" id="applySigBtn">Apply Signature</button>
      </div>
    </div>
  </div>

  <script src="vendor/pdflib/pdf-lib.min.js"></script>
  <script src="js/offline-engine.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
